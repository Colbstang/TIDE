name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-vector-analysis:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-core.txt
      - run: python reproduce.py --output verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evidence-${{ matrix.os }}
          path: |
            verification/verification.json
            verification/run.log
